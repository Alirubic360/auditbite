[project]
name = "auditbite"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "psycopg[binary]", "anthropic", "python-multipart", "weasyprint", "pyjwt", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "pypdf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
