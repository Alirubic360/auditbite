# Fly.io: API + worker from backend/Dockerfile (build context = repo root).  Deploy with:  fly deploy
app = "auditbite-api"          # change to a unique name
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[processes]
  web = "uvicorn auditbite.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m auditbite.worker"

[http_service]
  processes = ["web"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  processes = ["web", "worker"]
  size = "shared-cpu-1x"
  memory = "1gb"
